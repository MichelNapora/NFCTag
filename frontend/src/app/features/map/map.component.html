<div class="pagehead">
  <div>
    <div class="eyebrow">{{ msg.MAP_EYEBROW }}</div>
    <h2>{{ msg.MAP_TITLE }}</h2>
  </div>
  <button class="btn ghost" (click)="reload()">{{ msg.REFRESH }}</button>
</div>

<div *ngIf="error" class="banner error">{{ error }}</div>

<div class="maplegend">
  <span class="dot fill"></span> {{ msg.MAP_TECHNICIANS_HERE }} ({{ ongoingTotal }})
  <span class="dot"></span> {{ msg.MAP_QUIET_SITE }}
  <span class="muted" *ngIf="lastRefresh">{{ refreshLabel }}</span>
</div>

<div id="tags-map"></div>

<ng-container *ngIf="uncalibrated.length > 0">
  <div class="sectionlbl">{{ msg.MAP_UNCALIBRATED }}</div>
  <p class="hint">{{ msg.MAP_UNCALIBRATED_HINT }}</p>
  <div class="tablewrap">
    <table>
      <thead>
      <tr><th>{{ msg.LOCATION }}</th><th>{{ msg.STATE }}</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of uncalibrated">
          <td><strong>{{ wingLabel(t.wingId) }}</strong></td>
          <td><span class="st gray">{{ msg.MAP_UNCALIBRATED }}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>
