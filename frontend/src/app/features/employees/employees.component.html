<div class="pagehead">
  <div>
    <div class="eyebrow">Administration</div>
    <h2>Utilisateurs</h2>
  </div>
  <button class="btn" (click)="openCreate()">+ Nouvel utilisateur</button>
</div>

<div *ngIf="error" class="banner error">{{ error }}</div>


<div class="search">
  <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.7"/></svg>
  <input [(ngModel)]="query" placeholder="Rechercher un utilisateur…">
</div>

<div class="tablewrap">
  <table>
    <thead>
      <tr>
        <th>Nom</th><th>Email</th><th>Rôle</th><th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of filtered">
        <td>
          <strong>{{ e.firstname }} {{ e.lastname }}</strong>
          <span class="me" *ngIf="isMe(e)">vous</span>
        </td>
        <td>{{ e.email }}</td>
        <td>
          <span class="st fill" *ngIf="e.role === 'ADMIN'">Admin</span>
          <span class="st" *ngIf="e.role === 'EMPLOYEE'">Employé</span>
        </td>
        <td class="actions">
          <button class="iconbtn" title="Modifier" (click)="openEdit(e)">
            <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19l-4 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="iconbtn danger" title="Supprimer" *ngIf="!isMe(e)" (click)="remove(e)">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </td>
      </tr>
      <tr *ngIf="!loading && filtered.length === 0">
        <td colspan="4" class="muted">Aucun utilisateur.</td>
      </tr>
      <tr *ngIf="loading">
        <td colspan="4" class="muted">Chargement…</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modale création / modification -->
<div class="modal-back" *ngIf="modalOpen" (click)="close()">
  <div class="modal" role="dialog" (click)="$event.stopPropagation()">
    <div class="mhead">
      <h3>{{ form.id ? 'Modifier l\'utilisateur' : 'Nouvel utilisateur' }}</h3>
      <button class="iconbtn" title="Fermer" (click)="close()">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
    </div>
    <div class="mbody">
      <div class="msec">Identité</div>
      <div class="frow">
        <div class="field">
          <label>Prénom</label>
          <input [(ngModel)]="form.firstname" placeholder="Ex : Marie">
        </div>
        <div class="field">
          <label>Nom</label>
          <input [(ngModel)]="form.lastname" placeholder="Ex : Dubois">
        </div>
      </div>
      <div class="field">
        <label>Email (prenom.nom&#64;spi.be)</label>
        <input type="email" [(ngModel)]="form.email" placeholder="Ex : marie.dubois@spi.be">
      </div>
      <div class="msec">Accès</div>
      <div class="field">
        <label>Rôle</label>
        <select [(ngModel)]="form.role">
          <option value="EMPLOYEE">Employé — consulte et gère les données</option>
          <option value="ADMIN">Admin — gère en plus les utilisateurs</option>
        </select>
      </div>
      <div class="field">
        <label>{{ form.id ? 'Nouveau mot de passe (vide = inchangé)' : 'Mot de passe initial' }}</label>
        <div class="pwd">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="form.password" autocomplete="new-password"
                 [placeholder]="form.id ? 'Laisser vide pour ne pas changer' : 'Mot de passe à communiquer'">
          <button type="button" class="eye" (click)="showPassword = !showPassword"
                  [title]="showPassword ? 'Masquer' : 'Afficher'">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 20 20 4" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <div class="pwd">
          <input [type]="showConfirm ? 'text' : 'password'" [(ngModel)]="form.passwordConfirm" autocomplete="new-password"
                 placeholder="Retapez le même mot de passe">
          <button type="button" class="eye" (click)="showConfirm = !showConfirm"
                  [title]="showConfirm ? 'Masquer' : 'Afficher'">
            <svg *ngIf="!showConfirm" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            <svg *ngIf="showConfirm" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 20 20 4" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </div>
        <p class="mismatch" *ngIf="passwordMismatch">Les mots de passe ne correspondent pas.</p>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" (click)="close()">Annuler</button>
      <button class="btn" [disabled]="!canSave || saving" (click)="save()">
        {{ form.id ? 'Enregistrer' : 'Créer l\'utilisateur' }}
      </button>
    </div>
  </div>
</div>
