<div class="pagehead">
  <div>
    <div class="eyebrow">Gestion</div>
    <h2>Sociétés</h2>
  </div>
  <button class="btn" (click)="openCreate()">+ Nouvelle société</button>
</div>

<div *ngIf="error" class="banner error">{{ error }}</div>

<div class="search">
  <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.7"/></svg>
  <input [(ngModel)]="query" placeholder="Rechercher une société…">
</div>

<div class="tablewrap">
  <table>
    <thead>
      <tr>
        <th>Société</th><th>N° BCE</th><th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let b of filtered">
        <td><strong>{{ b.name }}</strong></td>
        <td class="num">{{ b.bce }}</td>
        <td class="actions">
          <button class="iconbtn" title="Modifier" (click)="openEdit(b)">
            <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19l-4 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
          <button class="iconbtn danger" title="Supprimer" *ngIf="auth.isAdmin" (click)="remove(b)">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          </button>
        </td>
      </tr>
      <tr *ngIf="!loading && filtered.length === 0">
        <td colspan="3" class="muted">Aucune société.</td>
      </tr>
      <tr *ngIf="loading">
        <td colspan="3" class="muted">Chargement…</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modale création / modification -->
<div class="modal-back" *ngIf="modalOpen" (click)="close()">
  <div class="modal" role="dialog" (click)="$event.stopPropagation()">
    <div class="mhead">
      <h3>{{ form.id ? 'Modifier la société' : 'Nouvelle société' }}</h3>
      <button class="iconbtn" title="Fermer" (click)="close()">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
    </div>
    <div class="mbody">
      <div class="msec">Société</div>
      <div class="field">
        <label>Nom</label>
        <input [(ngModel)]="form.name" placeholder="Ex : Électricité Dupont SPRL">
      </div>
      <div class="field">
        <label>N° BCE (10 chiffres, commence par 0 ou 1)</label>
        <input [(ngModel)]="form.bce" placeholder="Ex : 0123456749">
      </div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" (click)="close()">Annuler</button>
      <button class="btn" [disabled]="!canSave || saving" (click)="save()">
        {{ form.id ? 'Enregistrer' : 'Créer la société' }}
      </button>
    </div>
  </div>
</div>
