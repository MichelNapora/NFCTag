<div class="pagehead">
  <div>
    <div class="eyebrow">{{ msg.MANAGEMENT }}</div>
    <h2>{{ msg.BUSINESSES_TITLE }}</h2>
  </div>
  <button class="btn" (click)="openCreate()">{{ msg.NEW_BUSINESS_BUTTON }}</button>
</div>

<div *ngIf="error" class="banner error">{{ error }}</div>

<div class="search">
  <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="1.7"/></svg>
  <input [(ngModel)]="query" [placeholder]="msg.SEARCH_BUSINESS">
</div>

<div class="tablewrap">
  <table>
    <thead>
    <tr>
      <th>{{ msg.BUSINESS }}</th><th>{{ msg.BCE }}</th><th></th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let b of filtered">
      <td><strong>{{ b.name }}</strong></td>
      <td class="num">{{ b.bce }}</td>
      <td class="actions">
        <button class="iconbtn" [title]="msg.EDIT" (click)="openEdit(b)">
          <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19l-4 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button class="iconbtn danger" *ngIf="auth.isAdmin"
                [title]="canDelete(b.id) ? msg.BUTTON_DELETE : msg.DELETE_BLOCKED_BUSINESS_HINT"
                [disabled]="!canDelete(b.id)" (click)="remove(b)">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </td>
    </tr>
    <tr *ngIf="!loading && filtered.length === 0">
      <td colspan="3" class="muted">{{ msg.NO_BUSINESS }}</td>
    </tr>
    <tr *ngIf="loading">
      <td colspan="3" class="muted">{{ msg.LOADING }}</td>
    </tr>
    </tbody>
  </table>
</div>

<!-- Modale création / modification -->
<div class="modal-back" *ngIf="modalOpen" (click)="close()">
  <div class="modal" role="dialog" (click)="$event.stopPropagation()">
    <div class="mhead">
      <h3>{{ form.id ? msg.EDIT_BUSINESS : msg.NEW_BUSINESS }}</h3>
      <button class="iconbtn" [title]="msg.CLOSE" (click)="close()">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
    </div>
    <div class="mbody">
      <div class="msec">{{ msg.BUSINESS }}</div>
      <div class="field">
        <label>{{ msg.NAME }}</label>
        <input [(ngModel)]="form.name" [placeholder]="msg.BUSINESS_NAME_HINT">
      </div>
      <div class="field">
        <label>{{ msg.BCE_LABEL }}</label>
        <input [(ngModel)]="form.bce" [placeholder]="msg.BCE_HINT" [class.wrong]="bceMessage">
        <div class="fielderr" *ngIf="bceMessage">{{ bceMessage }}</div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" (click)="close()">{{ msg.CANCEL }}</button>
      <button class="btn" [disabled]="!canSave || saving" (click)="save()">
        {{ form.id ? msg.SAVE : msg.CREATE_BUSINESS }}
      </button>
    </div>
  </div>
</div>
