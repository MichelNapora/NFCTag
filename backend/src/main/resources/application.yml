spring:
  application:
    name: nfctag-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nfctag}
    username: ${DB_USER:nfctag}
    password: ${DB_PASSWORD:nfctag}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080


nfctag:
  estimated-duration-minutes: 60
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  proximity-meters: 200
  max-accuracy-meters: 50
  job-interval-ms: 600000

logging:
  level:
    org.flywaydb: info
