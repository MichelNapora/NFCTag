spring:
  application:
    name: nfctag-backend
  config:
    # Charge le fichier .env (données sensibles, non versionné — voir .env.example)
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nfctag}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}

nfctag:
  estimated-duration-minutes: 60
  timezone: Europe/Brussels
  max-login-attempts: ${MAX_LOGIN_ATTEMPTS}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  proximity-meters: 200
  max-accuracy-meters: 50
  job-interval-ms: 600000
  admin-email: ${ADMIN_EMAIL}
  admin-password: ${ADMIN_PASSWORD}

logging:
  level:
    org.flywaydb: info